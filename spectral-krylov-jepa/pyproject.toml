[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectral-krylov-jepa"
version = "0.1.0"
description = "Krylov-subspace joint-embedding pretraining for few-shot quantum eigenstate prediction"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Spectral Krylov-JEPA Contributors" }]
keywords = ["JEPA", "Krylov", "Lanczos", "Schrödinger", "self-supervised", "quantum"]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "torch>=2.1",
  "h5py>=3.10",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
  "tqdm>=4.66",
  "pytest>=7.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
