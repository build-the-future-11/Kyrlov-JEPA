name: Research-100 smoke

on:
  pull_request:
    paths:
      - 'spectral-krylov-jepa/scripts/20_run_research100_suite.py'
      - 'spectral-krylov-jepa/tests/test_research100.py'
      - '.github/workflows/research100-smoke.yml'
  workflow_dispatch:

jobs:
  research100:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e './spectral-krylov-jepa[dev]'
      - name: Registry tests
        run: python -m pytest spectral-krylov-jepa/tests/test_research100.py -q
      - name: Execute all 100 smoke handlers
        run: >
          python spectral-krylov-jepa/scripts/20_run_research100_suite.py
          --mode smoke
          --output-dir research100_smoke_artifacts
          --ids all
          --continue-on-error
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          MPLBACKEND: Agg
      - name: Require all 100 successful
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path('research100_smoke_artifacts/summary.json').read_text())
          assert s['executed'] == 100, s
          assert s['successful'] == 100, s
          assert s['failures'] == [], s
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research100-smoke
          path: research100_smoke_artifacts
          if-no-files-found: warn
