name: Krylov fresh confirmatory calibration

on:
  pull_request:
    paths:
      - 'spectral-krylov-jepa/scripts/19_run_confirmatory_calibration.py'
      - '.github/workflows/krylov-confirmatory.yml'
  workflow_dispatch:

jobs:
  confirmatory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e './spectral-krylov-jepa[dev]'
      - name: Run fresh confirmatory label-efficiency and OOD study
        run: >
          python spectral-krylov-jepa/scripts/19_run_confirmatory_calibration.py
          --output-dir confirmatory_artifacts
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          MPLBACKEND: Agg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: krylov-confirmatory-calibration
          path: confirmatory_artifacts
          if-no-files-found: warn
