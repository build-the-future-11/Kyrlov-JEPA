name: Research-100 full run

on:
  pull_request:
    paths:
      - '.github/workflows/research100-full-run.yml'
  workflow_dispatch:

jobs:
  research100-full:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e './spectral-krylov-jepa[dev]'
      - name: Execute all 100 full handlers
        run: >
          python spectral-krylov-jepa/scripts/20_run_research100_suite.py
          --mode full
          --output-dir research100_full_artifacts
          --ids all
          --continue-on-error
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          MPLBACKEND: Agg
      - name: Print summary
        if: always()
        run: cat research100_full_artifacts/summary.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research100-full
          path: research100_full_artifacts
          if-no-files-found: warn
