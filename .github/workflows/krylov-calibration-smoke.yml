name: Krylov physics calibration smoke

on:
  pull_request:
    paths:
      - 'spectral-krylov-jepa/**'
      - '.github/workflows/krylov-calibration-smoke.yml'
  workflow_dispatch:

jobs:
  calibration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e './spectral-krylov-jepa[dev]'
      - name: Run bounded calibration smoke
        run: >
          python spectral-krylov-jepa/scripts/18_run_physics_calibration_smoke.py
          --output-dir calibration_artifacts
          --seeds 11,23,47
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          MPLBACKEND: Agg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: krylov-physics-calibration-smoke
          path: calibration_artifacts
          if-no-files-found: warn
