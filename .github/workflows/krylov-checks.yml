name: Krylov engineering checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e './spectral-krylov-jepa[dev]'
      - run: python -m pytest spectral-krylov-jepa/tests tests -q
        env:
          OMP_NUM_THREADS: '1'
          MPLBACKEND: Agg
      - run: ruff check spectral-krylov-jepa/src spectral-krylov-jepa/scripts --select E9,F63,F7,F82
